<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tortugas Tía Paty</title>
<meta name="description" content="Arma la tarjeta de Navidad que acompaña tus Tortugas Tía Paty.">
<link rel="stylesheet" href="estilo.css?v=202610131928">
</head>
<body>
<div class="nieve" id="nieve"></div>
<div id="app"></div>

<script src="estilos.js?v=202610131928"></script>
<script src="adornos.js?v=202610131928"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var P = new URLSearchParams(location.search);
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  };

  // ------------------------------------------------- la tarjeta que se recibe
  function tarjeta(d) {
    var wa = "https://wa.me/" + window.TEL + "?text=" +
             encodeURIComponent("Hola! Me gustaría levantar un pedido, quisiera informes.");
    return '<div class="tarjeta">' + window.GUIRNALDA + window.PINOS +
      '<div class="cuerpo">' +
        '<div class="marca">Tortugas Tía Paty</div>' + window.ESTRELLA +
        '<h1>' + esc(d.t) + '</h1>' +
        '<p>' + esc(d.m) + '</p>' +
        '<div class="firma">Con cariño,<br><span>' + esc(d.de) + '</span></div>' +
        '<hr>' +
        '<div class="cierre">¿Te gustaron?</div>' +
        '<a class="boton" href="' + wa + '">Haz tu pedido</a>' +
        '<div class="pie">TORTUGAS TÍA PATY &middot; NAVIDAD 2026</div>' +
      '</div></div>';
  }

  // --------------------------------------------------------- modo tarjeta
  if (P.has("e") || P.has("t") || P.has("m") || P.has("de")) {
    var i = parseInt(P.get("e"), 10);
    var base = (i >= 1 && i <= window.ESTILOS.length) ? window.ESTILOS[i - 1] : window.ESTILOS[0];
    app.innerHTML = tarjeta({
      t:  (P.get("t") || base.t).slice(0, 90),
      m:  (P.get("m") || base.m).slice(0, 700),
      de: (P.get("de") || "quien te quiere").slice(0, 70)
    });
    window.nevar(document.getElementById("nieve"), 26);
    return;
  }

  // ------------------------------------------------------ modo constructor
  var sel = 0, propio = false;

  app.innerHTML =
    '<div class="armador">' +
      '<div class="cabeza">' +
        '<div class="marca">Tortugas Tía Paty</div>' +
        '<h1>Arma tu tarjeta de Navidad</h1>' +
        '<p>Escoge el mensaje que quieras —o escribe el tuyo— y fírmalo con tu nombre. ' +
        'Quien reciba tu caja escanea el código y le aparece tal cual lo dejaste.</p>' +
      '</div>' +
      '<div class="cols">' +
        '<div>' +
          '<div class="panel">' +
            '<h2><b>1</b>Escoge el mensaje</h2>' +
            '<div class="ops" id="ops"></div>' +
          '</div>' +
          '<div class="panel">' +
            '<h2><b>2</b>Ajústalo a tu gusto</h2>' +
            '<label for="t">Encabezado</label><input id="t" maxlength="90">' +
            '<label for="m">Mensaje</label><textarea id="m" maxlength="700"></textarea>' +
            '<label for="de">¿De parte de quién?</label>' +
            '<input id="de" maxlength="70" placeholder="Familia">' +
            '<div class="ayuda">Así va a aparecer firmada la tarjeta.</div>' +
          '</div>' +
          '<div class="listo">' +
            '<h2 style="margin-bottom:16px"><b>3</b>Tu tarjeta está lista</h2>' +
            '<div id="qr"></div>' +
            '<div class="liga" id="liga"></div>' +
            '<div class="acciones">' +
              '<button class="ac pri" id="bwa">Mandársela a Tía Paty</button>' +
              '<button class="ac" id="bcopiar">Copiar liga</button>' +
              '<button class="ac" id="bver">Verla</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div><div class="previo">Así se va a ver</div><div id="vista"></div></div>' +
      '</div>' +
      '<div class="velo" id="confirma" hidden>' +
        '<div class="dialogo">' +
          '<h3>Esto es lo que va a decir tu tarjeta</h3>' +
          '<div id="confirmaTxt"></div>' +
          '<div class="acciones">' +
            '<button class="ac pri" id="bmandar">Sí, mandarla</button>' +
            '<button class="ac" id="bcancelar">Déjame cambiarle algo</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var $ = function (id) { return document.getElementById(id); };

  // botones de estilo
  // Los botones van en bloques por grupo: con tantos mensajes, sueltos no se
  // encuentra nada.
  var ops = $("ops"), grupoActual = null, rejilla = null;
  window.ESTILOS.forEach(function (e, k) {
    if (e.g !== grupoActual) {
      grupoActual = e.g;
      var h = document.createElement("div");
      h.className = "grupo"; h.textContent = e.g;
      ops.appendChild(h);
      rejilla = document.createElement("div");
      rejilla.className = "rejilla";
      ops.appendChild(rejilla);
    }
    var b = document.createElement("button");
    b.className = "op"; b.type = "button";
    b.setAttribute("aria-pressed", k === 0 ? "true" : "false");
    b.dataset.k = k;
    b.innerHTML = '<span class="et">' + esc(e.n) + '</span><span class="ti">' + esc(e.t) + '</span>';
    b.onclick = function () { sel = k; propio = false; cargar(); };
    rejilla.appendChild(b);
  });
  var botones = ops.querySelectorAll(".op");

  function cargar() {
    $("t").value = window.ESTILOS[sel].t;
    $("m").value = window.ESTILOS[sel].m;
    marcar(); pintar();
  }
  function marcar() {
    [].forEach.call(botones, function (b) {
      b.setAttribute("aria-pressed",
        (!propio && Number(b.dataset.k) === sel) ? "true" : "false");
    });
  }

  function datos() {
    return { t: $("t").value.trim(), m: $("m").value.trim(),
             de: $("de").value.trim() || "quien te quiere" };
  }

  function liga() {
    var d = datos(), b = window.ESTILOS[sel], q = new URLSearchParams();
    // Si no le movió al texto, basta con el número del estilo: la liga queda corta
    // y el código QR sale con cuadritos grandes, que es lo que se lee bien impreso.
    if (!propio && d.t === b.t && d.m === b.m) {
      q.set("e", String(sel + 1));
    } else {
      q.set("t", d.t); q.set("m", d.m);
    }
    q.set("de", d.de);
    return location.origin + location.pathname + "?" + q.toString();
  }

  var qr = null;
  function pintar() {
    var d = datos();
    $("vista").innerHTML = tarjeta(d);
    var u = liga();
    $("liga").textContent = u;
    $("qr").innerHTML = "";
    qr = new QRCode($("qr"), { text: u, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
  }

  ["t", "m"].forEach(function (id) {
    $(id).addEventListener("input", function () { propio = true; marcar(); pintar(); });
  });
  $("de").addEventListener("input", pintar);

  $("bver").onclick = function () { window.open(liga(), "_blank"); };
  $("bcopiar").onclick = function () {
    var b = $("bcopiar");
    navigator.clipboard.writeText(liga()).then(function () {
      b.textContent = "¡Copiada!";
      setTimeout(function () { b.textContent = "Copiar liga"; }, 1800);
    }).catch(function () { b.textContent = "Cópiala de arriba"; });
  };
  function recado() {
    var d = datos();
    var raya = "\u2014\u2014\u2014\u2014";
    return ["Hola! Ya arm\u00e9 mi tarjeta para las tortugas.", "",
            raya, d.t, "", d.m, "", "Con cari\u00f1o, " + d.de, raya, "",
            "As\u00ed se ve: " + liga()].join("\n");
  }


  // Se confirma antes de mandar: lo que ve aqui es lo que va a decir la tarjeta,
  // y asi no llegan dos ligas del mismo cliente sin saber cual vale.
  $("bwa").onclick = function () {
    var d = datos();
    $("confirmaTxt").innerHTML =
      '<div class="cita"><strong>' + esc(d.t) + '</strong>' + esc(d.m) +
      '<em>Con cariño, ' + esc(d.de) + '</em></div>';
    $("confirma").hidden = false;
    document.body.style.overflow = "hidden";
  };
  $("bcancelar").onclick = function () {
    $("confirma").hidden = true;
    document.body.style.overflow = "";
  };
  $("confirma").addEventListener("click", function (ev) {
    if (ev.target === $("confirma")) $("bcancelar").onclick();
  });
  $("bmandar").onclick = function () {
    window.open("https://wa.me/" + window.TEL + "?text=" + encodeURIComponent(recado()), "_blank");
    $("bcancelar").onclick();
  };

  cargar();
  window.nevar(document.getElementById("nieve"), 22);
})();
</script>
</body>
</html>
