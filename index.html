<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tortugas Tía Paty</title>
<meta name="description" content="Arma las tarjetas de Navidad que acompañan tus Tortugas Tía Paty.">
<link rel="stylesheet" href="estilo.css?v=2026101400">
</head>
<body>
<div class="nieve" id="nieve"></div>
<div id="app"></div>

<script src="estilos.js?v=2026101400"></script>
<script src="adornos.js?v=2026101400"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var P = new URLSearchParams(location.search);
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  };

  // ------------------------------------------------- la tarjeta que se recibe
  function tarjeta(d) {
    var wa = "https://wa.me/" + window.TEL + "?text=" +
             encodeURIComponent("Hola! Me gustaría levantar un pedido, quisiera informes.");
    return '<div class="tarjeta">' + window.GUIRNALDA + window.PINOS +
      '<div class="cuerpo">' +
        '<div class="marca">Tortugas Tía Paty</div>' + window.ESTRELLA +
        '<h1>' + esc(d.t) + '</h1>' +
        '<p>' + esc(d.m) + '</p>' +
        '<div class="firma">Con cariño,<br><span>' + esc(d.de) + '</span></div>' +
        '<hr>' +
        '<div class="cierre">¿Te gustaron?</div>' +
        '<a class="boton" href="' + wa + '">Haz tu pedido</a>' +
        '<div class="pie">TORTUGAS TÍA PATY &middot; NAVIDAD 2026</div>' +
      '</div></div>';
  }

  // --------------------------------------------------------- modo tarjeta
  if (P.has("e") || P.has("t") || P.has("m") || P.has("de")) {
    var i = parseInt(P.get("e"), 10);
    var base = (i >= 1 && i <= window.ESTILOS.length) ? window.ESTILOS[i - 1] : window.ESTILOS[0];
    app.innerHTML = tarjeta({
      t:  (P.get("t") || base.t).slice(0, 90),
      m:  (P.get("m") || base.m).slice(0, 700),
      de: (P.get("de") || "quien te quiere").slice(0, 70)
    });
    window.nevar(document.getElementById("nieve"), 26);
    return;
  }

  // ====================================================== modo constructor
  var sel = 0, propio = false;
  // El pedido puede llevar varias tarjetas distintas: una para los compadres,
  // otra para la suegra, otra para la empresa. Cada una con su cantidad.
  var pedido = [];
  try { pedido = JSON.parse(localStorage.getItem("pedido") || "[]"); } catch (e) { pedido = []; }

  app.innerHTML =
    '<div class="armador">' +
      '<div class="cabeza">' +
        '<div class="marca">Tortugas Tía Paty</div>' +
        '<h1>Arma tus tarjetas de Navidad</h1>' +
        '<p>Escoge el mensaje que quieras —o escribe el tuyo—, fírmalo y dinos cuántas cajas ' +
        'llevan esa tarjeta. Puedes agregar tantas tarjetas distintas como quieras.</p>' +
      '</div>' +
      '<div class="cols">' +
        '<div>' +
          '<div class="panel">' +
            '<h2><b>1</b>Escoge el mensaje</h2>' +
            '<div id="ops"></div>' +
          '</div>' +
          '<div class="panel">' +
            '<h2><b>2</b>Ajústalo a tu gusto</h2>' +
            '<label for="t">Encabezado</label><input id="t" maxlength="90">' +
            '<label for="m">Mensaje</label><textarea id="m" maxlength="700"></textarea>' +
            '<label for="de">¿De parte de quién?</label>' +
            '<input id="de" maxlength="70" placeholder="Familia">' +
            '<div class="ayuda">Así va a aparecer firmada la tarjeta.</div>' +
          '</div>' +
          '<div class="panel">' +
            '<h2><b>3</b>¿Cuántas cajas llevan esta tarjeta?</h2>' +
            '<div class="fila">' +
              '<div class="cuenta">' +
                '<button type="button" class="pm" id="bmenos" aria-label="Una menos">–</button>' +
                '<input id="cant" type="number" min="1" max="999" value="1" inputmode="numeric">' +
                '<button type="button" class="pm" id="bmas" aria-label="Una más">+</button>' +
              '</div>' +
              '<button class="ac pri crece" id="bagregar">Agregar a mi pedido</button>' +
            '</div>' +
            '<div class="ayuda">Agrega una tarjeta por cada grupo: los compadres, la suegra, ' +
            'la oficina… cada quien con su mensaje.</div>' +
          '</div>' +
          '<div class="panel" id="panelPedido">' +
            '<h2><b>4</b>Tu pedido</h2>' +
            '<div id="lista"></div>' +
            '<div class="total" id="total"></div>' +
            '<div class="acciones" id="accionesPedido">' +
              '<button class="ac pri" id="bwa">Mandar mi pedido a Tía Paty</button>' +
              '<button class="ac" id="bvaciar">Vaciar</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="lado">' +
          '<div class="previo">Así se va a ver</div>' +
          '<div id="vista"></div>' +
          '<div class="qrcaja">' +
            '<div id="qr"></div>' +
            '<div class="ayuda" style="text-align:center">Este es el código que va en la caja.</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="velo" id="confirma" hidden>' +
        '<div class="dialogo">' +
          '<h3>Esto es lo que vamos a preparar</h3>' +
          '<div id="confirmaTxt"></div>' +
          '<div class="acciones">' +
            '<button class="ac pri" id="bmandar">Sí, mandarlo</button>' +
            '<button class="ac" id="bcancelar">Déjame cambiarle algo</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var $ = function (id) { return document.getElementById(id); };

  // --------------------------------------------- botones de estilo, por grupo
  var ops = $("ops"), grupoActual = null, rejilla = null;
  window.ESTILOS.forEach(function (e, k) {
    if (e.g !== grupoActual) {
      grupoActual = e.g;
      var h = document.createElement("div");
      h.className = "grupo"; h.textContent = e.g;
      ops.appendChild(h);
      rejilla = document.createElement("div");
      rejilla.className = "rejilla";
      ops.appendChild(rejilla);
    }
    var b = document.createElement("button");
    b.className = "op"; b.type = "button";
    b.setAttribute("aria-pressed", k === 0 ? "true" : "false");
    b.dataset.k = k;
    b.innerHTML = '<span class="et">' + esc(e.n) + '</span><span class="ti">' + esc(e.t) + '</span>';
    b.onclick = function () { sel = k; propio = false; cargar(); };
    rejilla.appendChild(b);
  });
  var botones = ops.querySelectorAll(".op");

  function cargar() {
    $("t").value = window.ESTILOS[sel].t;
    $("m").value = window.ESTILOS[sel].m;
    marcar(); pintar();
  }
  function marcar() {
    [].forEach.call(botones, function (b) {
      b.setAttribute("aria-pressed",
        (!propio && Number(b.dataset.k) === sel) ? "true" : "false");
    });
  }

  function datos() {
    return { t: $("t").value.trim(), m: $("m").value.trim(),
             de: $("de").value.trim() || "quien te quiere" };
  }

  // Si no le movio al texto basta el numero del estilo: la liga queda corta y
  // el codigo QR sale con cuadritos grandes, que es lo que se lee bien impreso.
  function ligaDe(d) {
    var b = window.ESTILOS[sel], q = new URLSearchParams();
    if (!propio && d.t === b.t && d.m === b.m) q.set("e", String(sel + 1));
    else { q.set("t", d.t); q.set("m", d.m); }
    q.set("de", d.de);
    return location.origin + location.pathname + "?" + q.toString();
  }

  function pintar() {
    var d = datos();
    $("vista").innerHTML = tarjeta(d);
    $("qr").innerHTML = "";
    new QRCode($("qr"), { text: ligaDe(d), width: 128, height: 128,
                          correctLevel: QRCode.CorrectLevel.M });
  }

  ["t", "m"].forEach(function (id) {
    $(id).addEventListener("input", function () { propio = true; marcar(); pintar(); });
  });
  $("de").addEventListener("input", pintar);

  // ------------------------------------------------------------- la cantidad
  function cant() {
    var n = parseInt($("cant").value, 10);
    return (n >= 1 && n <= 999) ? n : 1;
  }
  $("bmenos").onclick = function () { $("cant").value = Math.max(1, cant() - 1); };
  $("bmas").onclick   = function () { $("cant").value = Math.min(999, cant() + 1); };

  // --------------------------------------------------------------- el pedido
  function guardar() {
    try { localStorage.setItem("pedido", JSON.stringify(pedido)); } catch (e) {}
  }

  function verLista() {
    var p = $("panelPedido");
    if (!pedido.length) {
      $("lista").innerHTML = '<div class="vacio">Todavía no has agregado ninguna tarjeta.</div>';
      $("total").textContent = "";
      $("accionesPedido").style.display = "none";
      return;
    }
    $("accionesPedido").style.display = "";
    $("lista").innerHTML = pedido.map(function (x, k) {
      return '<div class="renglon">' +
        '<div class="rtxt"><strong>' + esc(x.t) + '</strong>' +
          '<span>Para: ' + esc(x.de) + '</span></div>' +
        '<div class="rcant">' + x.n + (x.n === 1 ? " caja" : " cajas") + '</div>' +
        '<button type="button" class="quitar" data-k="' + k + '" aria-label="Quitar">×</button>' +
      '</div>';
    }).join("");
    var tot = pedido.reduce(function (a, x) { return a + x.n; }, 0);
    $("total").textContent = "Total: " + tot + (tot === 1 ? " caja" : " cajas") +
      " · " + pedido.length + (pedido.length === 1 ? " tarjeta" : " tarjetas distintas");
    [].forEach.call($("lista").querySelectorAll(".quitar"), function (b) {
      b.onclick = function () {
        pedido.splice(Number(b.dataset.k), 1); guardar(); verLista();
      };
    });
  }

  $("bagregar").onclick = function () {
    var d = datos();
    if (!d.t || !d.m) return;
    pedido.push({ t: d.t, m: d.m, de: d.de, n: cant(), liga: ligaDe(d) });
    guardar(); verLista();
    $("cant").value = 1;
    var b = $("bagregar"), antes = b.textContent;
    b.textContent = "✓ Agregada";
    setTimeout(function () { b.textContent = antes; }, 1400);
    $("panelPedido").scrollIntoView({ behavior: "smooth", block: "center" });
  };

  $("bvaciar").onclick = function () {
    pedido = []; guardar(); verLista();
  };

  // ------------------------------------------------- confirmar y mandar todo
  function recado() {
    var lineas = ["Hola! Ya armé mi pedido de tortugas.", ""];
    var raya = "————";
    pedido.forEach(function (x, k) {
      lineas.push("TARJETA " + (k + 1) + " — " + x.n + (x.n === 1 ? " caja" : " cajas"));
      lineas.push(raya, x.t, "", x.m, "", "Con cariño, " + x.de, raya);
      lineas.push("Así se ve: " + x.liga, "");
    });
    var tot = pedido.reduce(function (a, x) { return a + x.n; }, 0);
    lineas.push("TOTAL: " + tot + (tot === 1 ? " caja" : " cajas"));
    return lineas.join("\n");
  }

  $("bwa").onclick = function () {
    if (!pedido.length) return;
    $("confirmaTxt").innerHTML = pedido.map(function (x, k) {
      return '<div class="cita"><span class="cuantas">Tarjeta ' + (k + 1) + ' · ' + x.n +
        (x.n === 1 ? " caja" : " cajas") + '</span><strong>' + esc(x.t) + '</strong>' +
        esc(x.m) + '<em>Con cariño, ' + esc(x.de) + '</em></div>';
    }).join("");
    $("confirma").hidden = false;
    document.body.style.overflow = "hidden";
  };
  $("bcancelar").onclick = function () {
    $("confirma").hidden = true;
    document.body.style.overflow = "";
  };
  $("confirma").addEventListener("click", function (ev) {
    if (ev.target === $("confirma")) $("bcancelar").onclick();
  });
  $("bmandar").onclick = function () {
    window.open("https://wa.me/" + window.TEL + "?text=" + encodeURIComponent(recado()), "_blank");
    $("bcancelar").onclick();
  };

  cargar();
  verLista();
  window.nevar(document.getElementById("nieve"), 22);
})();
</script>
</body>
</html>
